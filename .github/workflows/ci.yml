name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 ships no prebuild for this version and compiles from source.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
