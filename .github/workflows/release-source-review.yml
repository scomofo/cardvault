name: Verify release review corrections
on:
  push:
    branches: [feat/reviewed-batch-publish]
    paths: [.github/workflows/release-source-review.yml]
permissions:
  contents: write
concurrency:
  group: cardvault-release-review
  cancel-in-progress: false
jobs:
  verify-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve reviewed inputs and verify expected branch heads
        run: |
          cp .review/safety-review.b64 "$RUNNER_TEMP/safety-review.b64"
          cp .review/apply-batch-review.py "$RUNNER_TEMP/apply-batch-review.py"
          git fetch origin fix/selling-workflow-safety feat/batch-to-draft
          test "$(git rev-parse origin/fix/selling-workflow-safety)" = 2fdbb9192e28bd63a9690b3c356694770bc0e01b
          test "$(git rev-parse origin/feat/batch-to-draft)" = 036fc8a64a222a16ec41557d882608f4ada186af
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          patch = gzip.decompress(base64.b64decode((root/'safety-review.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '2f93aa12b8caa30a79d073e6ecbea6b22392d1c8f93a3f6e625de5f373b2fb93'
          (root/'safety-review.patch').write_bytes(patch)
          PY
          git config user.name 'CardVault review automation'
          git config user.email '159295352+scomofo@users.noreply.github.com'
      - name: Apply and test safety corrections
        run: |
          git switch -c reviewed-safety origin/fix/selling-workflow-safety
          git apply --check "$RUNNER_TEMP/safety-review.patch"
          git apply "$RUNNER_TEMP/safety-review.patch"
          npm ci
          npm run lint
          npm run build
          npm test
          git diff --check
          git add src tests docs
          git commit -m 'Fix review findings in shipment claims, removals and ready drafts'
      - name: Integrate corrected safety with batch workflow
        run: |
          git switch -c reviewed-batch origin/feat/batch-to-draft
          if ! git merge --no-commit --no-ff reviewed-safety; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test "$conflicts" = src/components/BatchView.jsx
            git checkout --ours -- src/components/BatchView.jsx
            git add src/components/BatchView.jsx
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 "$RUNNER_TEMP/apply-batch-review.py"
          npm run lint
          npm run build
          npm test
          git diff --check
          git add src tests docs
          git commit -m 'Integrate safety corrections and fix batch relisting and rapid edits'
      - name: Push tested PR branches atomically, never master
        run: |
          git push --atomic origin reviewed-safety:refs/heads/fix/selling-workflow-safety reviewed-batch:refs/heads/feat/batch-to-draft
          echo "Safety: $(git rev-parse reviewed-safety)" >> "$GITHUB_STEP_SUMMARY"
          echo "Batch: $(git rev-parse reviewed-batch)" >> "$GITHUB_STEP_SUMMARY"
