name: Apply validated selling safety patch
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/selling-workflow-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact reviewed source patch
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const encoded = [0, 1, 2].map(n => readFileSync(`.review/selling-patch.${n}`, 'utf8').trim()).join('');
          const patch = brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const hash = createHash('sha256').update(patch).digest('hex');
          if (hash !== 'ad09e9d5534a27048f891737e4714ce1efc4483a9bd7184304a5cab04e4533cb') throw new Error(`Patch checksum mismatch: ${hash}`);
          writeFileSync('/tmp/selling-safety.patch', patch);
          NODE
          git apply --check --index --unidiff-zero /tmp/selling-safety.patch
          git apply --index --unidiff-zero /tmp/selling-safety.patch
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert paths and all(p.startswith(('src/', 'tests/', 'docs/')) or p in ('AGENTS.md', 'CLAUDE.md', 'README.md') for p in paths), paths
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Commit tested source to safety branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Complete selling safety fixes with 461 passing regression tests"
          git push origin HEAD:refs/heads/fix/selling-workflow-safety
