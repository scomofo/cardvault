name: Selling safety review snapshot
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/selling-workflow-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package source and dependencies for isolated review
        run: tar --exclude=.git --exclude=.env --exclude=dist --exclude=dist-electron -czf /tmp/cardvault-review.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: cardvault-review
          path: /tmp/cardvault-review.tgz
          retention-days: 1
