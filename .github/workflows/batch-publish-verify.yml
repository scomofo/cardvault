name: Verify reviewed batch publication
on:
  push:
    branches: [feat/batch-publish]
    paths: [.github/workflows/batch-publish-verify.yml]
permissions:
  contents: write
concurrency:
  group: cardvault-batch-publish-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped integration and remove temporary tooling
        run: |
          git merge-base --is-ancestor f705e9b7ff8086f62912f4b5304cc244083c5e10 HEAD
          python3 .review/wire-batch-publish.py
          git rm .review/wire-batch-publish.py .github/workflows/batch-publish-verify.yml
      - run: npm ci
      - name: Lint
        run: npm run lint | tee "$RUNNER_TEMP/lint.txt"
      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.txt"
      - name: Full tests
        run: npm test | tee "$RUNNER_TEMP/tests.txt"
      - name: Commit verified source to feature branch only
        run: |
          git diff --check
          git config user.name 'CardVault review automation'
          git config user.email '159295352+scomofo@users.noreply.github.com'
          git add -A
          git commit -m 'Wire reviewed batch publication and remove temporary integration tools'
          git push origin HEAD:refs/heads/feat/batch-publish
          mkdir -p "$RUNNER_TEMP/verified"
          git rev-parse HEAD > "$RUNNER_TEMP/verified/validation.txt"
          grep -E '^# (tests|pass|fail|skipped|cancelled)' "$RUNNER_TEMP/tests.txt" >> "$RUNNER_TEMP/verified/validation.txt"
          grep -E 'problems|errors' "$RUNNER_TEMP/lint.txt" >> "$RUNNER_TEMP/verified/validation.txt" || true
          echo 'Production build and git diff --check: passed' >> "$RUNNER_TEMP/verified/validation.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/verified/source.tar.gz"
          cat "$RUNNER_TEMP/verified/validation.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-batch-publication
          path: ${{ runner.temp }}/verified
          retention-days: 2
